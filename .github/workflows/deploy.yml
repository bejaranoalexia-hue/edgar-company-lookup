name: Publish target profile

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ticker:
        description: Ticker or company name
        required: false
        default: Florida Crystals
      private:
        description: The company does not file with the SEC
        type: boolean
        default: true
      aliases:
        description: Other names to search, comma-separated (private companies)
        required: false
        default: ""
      sic:
        description: Industry SIC code (private companies), e.g. 2061 for cane sugar
        required: false
        default: "2061"
      tech:
        description: Comma-separated vendors to check against CISA KEV (optional)
        required: false
        default: ""
      skip_news:
        description: Skip the news API to save trial quota
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the profile from EDGAR, CybersecurityNews.us and CISA KEV
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TICKER: ${{ github.event.inputs.ticker || 'Florida Crystals' }}
          PRIVATE: ${{ github.event.inputs.private || 'true' }}
          ALIASES: ${{ github.event.inputs.aliases || '' }}
          SIC: ${{ github.event.inputs.sic || '2061' }}
          TECH: ${{ github.event.inputs.tech || '' }}
          SKIP_NEWS: ${{ github.event.inputs.skip_news || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${EDGAR_USER_AGENT}" ]; then
            export EDGAR_USER_AGENT="EdgarCompanyLookup edgar-lookup@example.com"
          fi
          args=("$TICKER")
          if [ "$PRIVATE" = "true" ]; then
            args+=(--private --sic "$SIC")
            if [ -n "$ALIASES" ]; then args+=(--aliases "$ALIASES"); fi
          fi
          if [ -n "$TECH" ]; then args+=(--tech "$TECH"); fi
          if [ "$SKIP_NEWS" = "true" ]; then args+=(--no-news); fi
          mkdir -p build
          if python scripts/build_profile.py "${args[@]}" > build/profile.json; then
            python scripts/render_report.py build/profile.json site/index.html
          else
            cat build/profile.json
            echo "Profile build failed. Publishing the report already in the repository."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
